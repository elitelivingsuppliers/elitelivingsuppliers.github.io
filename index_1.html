  max-width:432px;
  padding:34px 22px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.logo{
  width:min(228px,58vw);
  height:auto;
  display:block;
  margin-bottom:6px;
}
h1{
  font-family:'Marcellus',serif;
  font-weight:400;
  font-size:clamp(24px,6.4vw,28px);
  letter-spacing:.14em;
  text-transform:uppercase;
  line-height:1.25;
}
h1 .sub{
  display:block;
  font-size:.52em;
  letter-spacing:.52em;
  margin-top:2px;
  color:var(--taupe);
  padding-left:.52em; /* optically center the tracked text */
}
/* Signature: gold roofline divider echoing the logo mark */
.roofline{
  width:188px;
  margin:20px auto 14px;
  display:block;
  overflow:visible;
}
.tagline{
  font-size:13.5px;
  font-weight:500;
  letter-spacing:.30em;
  text-transform:uppercase;
  color:var(--brass);
  margin-bottom:4px;
  padding-left:.30em;
}
.place{
  font-size:12.5px;
  letter-spacing:.14em;
  color:var(--taupe);
  margin-bottom:30px;
  padding-left:.14em;
}
.links{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:14px;
  list-style:none;
}
.plate{
  position:relative;
  display:flex;
  align-items:center;
  gap:15px;
  width:100%;
  padding:15px 18px;
  background:var(--plate);
  border:1px solid var(--hairline);
  border-radius:14px;
  text-decoration:none;
  color:var(--ink);
  box-shadow:0 1px 2px rgba(63,50,24,.06), 0 10px 26px -18px rgba(63,50,24,.35);
  overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
/* brass sheen that sweeps across on hover / tap */
.plate::after{
  content:"";
  position:absolute;
  top:0;bottom:0;left:-70%;
  width:46%;
  background:linear-gradient(105deg, rgba(217,180,91,0) 0%, rgba(217,180,91,.20) 50%, rgba(217,180,91,0) 100%);
  transform:skewX(-14deg);
  transition:left .5s ease;
  pointer-events:none;
}
.plate:hover,.plate:focus-visible{
  transform:translateY(-2px);
  border-color:var(--brass);
  box-shadow:0 2px 3px rgba(63,50,24,.07), 0 16px 30px -16px rgba(63,50,24,.4);
}
.plate:hover::after,.plate:focus-visible::after{left:130%}
.plate:active{transform:translateY(0) scale(.985)}
.plate:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.badge{
  flex:0 0 46px;
  width:46px;height:46px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;
}
.badge svg{width:23px;height:23px;fill:currentColor;display:block}
.b-wa{background:#1FAF54}
.b-fb{background:#1877F2}
.b-ig{background:radial-gradient(circle at 30% 110%, #FDDB63 0%, #F58529 24%, #DD2A7B 52%, #8134AF 78%, #515BD4 100%)}
.b-x{background:#26231E}
.meta{flex:1;text-align:left;min-width:0}
.meta .name{
  display:block;
  font-weight:600;
  font-size:16px;
  letter-spacing:.05em;
}
.meta .hint{
  display:block;
  font-size:13px;
  color:var(--taupe);
  letter-spacing:.03em;
  margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.arrow{
  flex:0 0 auto;
  color:var(--brass);
  transition:transform .18s ease;
}
.plate:hover .arrow{transform:translateX(3px)}
footer{
  margin-top:34px;
  font-size:11.5px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--taupe);
  padding-left:.22em;
}
/* entrance */
@media (prefers-reduced-motion: no-preference){
  .rise{opacity:0;transform:translateY(12px);animation:rise .6s ease forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}
  .d4{animation-delay:.30s}.d5{animation-delay:.38s}.d6{animation-delay:.46s}.d7{animation-delay:.54s}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
}
</style>
</head>
